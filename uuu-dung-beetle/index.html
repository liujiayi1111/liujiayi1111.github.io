  <style>:root{--bg:#f5f7fb;--bg-soft:#ffffff;--card:#ffffff;--border:#e8ebf1;--text-main:#0f1419;--text-sub:#5b6472;--accent:#5b8def;--accent-2:#8b5cf6;--accent-3:#22c1c3;--warn:#e0913f;--safe:#1fa672;--shadow:0 10px 30px rgba(20, 30, 60, 0.08);--shadow-strong:0 20px 50px rgba(20, 30, 60, 0.14);--radius:18px}*{margin:0;padding:0;box-sizing:border-box}body,html{width:100%;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text-main);overflow-x:hidden}body::before{content:"";position:fixed;top:-20%;left:-10%;width:60vw;height:60vw;background:radial-gradient(circle,rgba(91,141,239,.16),transparent 70%);z-index:-2;animation:18s ease-in-out infinite float1}body::after{content:"";position:fixed;bottom:-25%;right:-10%;width:55vw;height:55vw;background:radial-gradient(circle,rgba(139,92,246,.14),transparent 70%);z-index:-2;animation:22s ease-in-out infinite float2}@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,60px) scale(1.1)}}@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,-40px) scale(1.08)}}.layout{max-width:720px;margin:0 auto;position:relative;z-index:1}.main{min-height:100vh;background:var(--bg-soft);border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:var(--shadow-strong)}.top-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:22px 28px;display:flex;align-items:center;gap:12px}.brand-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:19px;box-shadow:0 6px 16px rgba(91,141,239,.35);flex-shrink:0}.top-header-text h1{font-size:22px;font-weight:800;letter-spacing:-.02em}.top-header-text p{font-size:16px;color:var(--text-sub);margin-top:2px}.feed{padding:6px 0}.post{padding:22px 28px;border-bottom:1px solid var(--border);transition:background .25s;position:relative}.post:hover{background:rgba(91,141,239,.035)}.post-media{border-radius:16px;overflow:hidden;border:1px solid var(--border);position:relative}.post-media img{width:100%;display:block;max-height:460px;object-fit:cover;transition:transform .5s;cursor:zoom-in}.post-media:hover img{transform:scale(1.04)}.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:16px;overflow:hidden;border:1px solid var(--border)}.media-grid img{width:100%;height:100%;object-fit:cover;display:block;max-height:260px;transition:transform .5s;cursor:zoom-in}.media-grid img:hover{transform:scale(1.05)}.link-row{display:flex;gap:10px;margin-top:14px}.link-btn{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);text-decoration:none;transition:.25s;min-width:0}.link-btn-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}.link-btn-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}.link-btn-text{min-width:0}.link-btn-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.link-btn.pirate{background:rgba(224,145,63,.06)}.link-btn.pirate .link-btn-icon{background:linear-gradient(135deg,#f0a94e,var(--warn))}.link-btn.pirate:hover{border-color:var(--warn);box-shadow:0 10px 22px rgba(224,145,63,.22);transform:translateY(-2px)}.link-btn.official{background:rgba(31,166,114,.06)}.link-btn.official .link-btn-icon{background:linear-gradient(135deg,#2fc98a,var(--safe))}.link-btn.official:hover{border-color:var(--safe);box-shadow:0 10px 22px rgba(31,166,114,.22);transform:translateY(-2px)}.lightbox{position:fixed;inset:0;background:rgba(10,12,20,.9);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px);animation:.25s fadeIn}.lightbox.open{display:flex}@keyframes fadeIn{from{opacity:0}to{opacity:1}}.lightbox img{max-width:88vw;max-height:88vh;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:.3s zoomIn}@keyframes zoomIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}.lightbox-close{position:absolute;top:26px;right:26px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:background .2s}.lightbox-close:hover{background:rgba(255,255,255,.24)}.lightbox-close svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:0 0}::-webkit-scrollbar-thumb{background:#d5dae4;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#b8c0cf}@media (max-width:760px){.main{border-left:none;border-right:none}.top-header{padding:16px 18px}.top-header-text h1{font-size:18px}.post{padding:16px}.link-row{flex-direction:column}}</style>

<body>
  <div class="layout">
    <main class="main">
      <div class="top-header">
        <div class="top-header-text">
          <h1>Uuucvea 盗帖合集</h1>
          <p>收集了 Uuucvea 抄袭的帖子以及来源截图。</p>
          <article class="post">
            <div class="post-media"><img src="src/0.png" alt="帖子图片" loading="lazy"></div>
          </article>
        </div>
      </div>
      <div class="feed" id="feed"></div>
    </main>
  </div>
  <div class="lightbox" id="lightbox">
    <div class="lightbox-close" id="lightboxClose"><svg viewBox="0 0 24 24">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg></div>
    <img id="lightboxImg" src="" alt="">
  </div>
  <script src="data.js"></script>
  <script>
    const pirateIcon = '<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.7 17a2 2 0 001.7 3h15.2a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>';
    const officialIcon = '<svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>';

    function renderMedia(images) {
      if (!images || images.length === 0) return "";
      if (images.length === 1) {
        return `<div class="post-media"><img src="${images[0]}" alt="帖子图片" loading="lazy"></div>`;
      }
      const imgs = images.map(src => `<img src="${src}" alt="帖子图片" loading="lazy">`).join("");
      return `<div class="media-grid">${imgs}</div>`;
    }

    function shortHost(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace("www.", "") + u.pathname;
      } catch (e) { return url; }
    }

    function renderLinks(p) {
      return `
  <div class="link-row">
    <a class="link-btn pirate" href="${p.pirateLink}" target="_blank" rel="noopener">
      <div class="link-btn-icon">${pirateIcon}</div>
      <div class="link-btn-text">
        <div class="link-btn-title">盗版内容</div>
      </div>
    </a>
    <a class="link-btn official" href="${p.officialLink}" target="_blank" rel="noopener">
      <div class="link-btn-icon">${officialIcon}</div>
      <div class="link-btn-text">
        <div class="link-btn-title">来源内容</div>
      </div>
    </a>
  </div>`;
    }

    function renderPost(p, idx) {
      return `
  <article class="post" data-idx="${idx}">
    ${renderMedia(p.images)}
    ${renderLinks(p)}
  </article>`;
    }

    const feedEl = document.getElementById("feed");
    function renderFeed() {
      feedEl.innerHTML = postsData.map((p, i) => renderPost(p, i)).join("");
      bindPostEvents();
    }
    renderFeed();

    function bindPostEvents() {
      document.querySelectorAll(".media-grid img, .post-media img").forEach(img => {
        img.addEventListener("click", (e) => {
          e.stopPropagation();
          openLightbox(img.src);
        });
      });
    }

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("open");
    }

    document.getElementById("lightboxClose").addEventListener("click", () => lightbox.classList.remove("open"));
    lightbox.addEventListener("click", (e) => { if (e.target === lightbox) lightbox.classList.remove("open"); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") lightbox.classList.remove("open"); });
  </script>
</body>
</html>
